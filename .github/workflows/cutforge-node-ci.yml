name: CutForge Node.js + FFmpeg

on:
  push:
    branches: [feat/cutforge-ai-mvp]
    paths:
      - 'cutforge-ai/node-server/**'
      - 'cutforge-ai/frontend/app.js'
      - '.github/workflows/cutforge-node-ci.yml'
  pull_request:
    paths:
      - 'cutforge-ai/node-server/**'
      - 'cutforge-ai/frontend/app.js'
      - '.github/workflows/cutforge-node-ci.yml'

jobs:
  node-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check JS syntax
        run: |
          node --check cutforge-ai/node-server/server.mjs
          node --check cutforge-ai/frontend/app.js
      - name: Run Node integration tests
        working-directory: cutforge-ai/node-server
        run: node --test
